<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dr. Abdo’s Health Resources</title>
<style>
:root{--paper:#F2F5F4;--sheet:#fff;--ink:#16312C;--muted:#566B66;--rule:#D3DDDA;--accent:#1D6A86;--soft:#E1EEF3;--bad:#B3261E;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--paper:#0E1917;--sheet:#152421;--ink:#E2ECE9;--muted:#9BB1AB;--rule:#2A3E3A;--accent:#72C3DE;--soft:#18323A;--bad:#FF968C;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:28px 26px}
.mark{width:52px;height:52px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--accent);margin-bottom:14px}
.mark svg{width:28px;height:28px}
h1{font-size:1.35rem;line-height:1.2;margin:0 0 4px}
.hello{font-size:clamp(1.6rem,6vw,2rem);letter-spacing:-.02em;margin:0 0 6px}
.greet{color:var(--ink);font-weight:600;font-size:1rem;margin:0 0 4px}
p{margin:0 0 18px;color:var(--muted);font-size:.93rem}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:2px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.row{display:flex;align-items:center;gap:10px;margin:14px 0 18px;font-size:.92rem}
.row input{width:20px;height:20px;accent-color:var(--accent)}
button{width:100%;font:inherit;font-weight:700;font-size:1rem;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-weight:600;font-size:.9rem;min-height:1.4em;margin:10px 0 0}
.fine{font-size:.8rem;margin:16px 0 0}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.5-7.5-10A4 4 0 0 1 12 7.5 4 4 0 0 1 19.5 10c0 5.5-7.5 10-7.5 10z"/></svg></div>
  <h1 class="hello">Welcome to Dr. Abdo’s Health Resources</h1>
  <p class="greet" id="greet">Trusted health information and care guides.</p>
  <p>Enter the password from your visit handout to open them.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="health-resources" autocomplete="username" hidden>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <div class="row"><input id="rem" type="checkbox"><label for="rem" style="margin:0;font-weight:500">Keep me signed in on this device</label></div>
    <button id="go" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="fine">Only check “keep me signed in” on your own phone or computer.</p>
</main>

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>{let s="";u=new Uint8Array(u);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
async function derive(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
async function decryptApp(key){const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(P.iv)},key,b64d(P.ct));return new TextDecoder().decode(buf)}
function show(html){
  // add a "Lock" button next to the Share button so the app can be locked again

  document.open();document.write(html);document.close();}
(async()=>{

  btn.disabled=true;btn.textContent="Unlocking…";err.textContent="";
  try{const key=await derive(document.getElementById("pw").value);const html=await decryptApp(key);
    if(document.getElementById("rem").checked){try{localStorage.setItem(KEYNAME,JSON.stringify({salt:P.salt,k:b64e(await crypto.subtle.exportKey("raw",key))}))}catch(_){}}
    show(html)}
  catch(x){err.textContent="That password didn't work. Try again.";btn.disabled=false;btn.textContent="Unlock";document.getElementById("pw").select()}});
})();
</script>
